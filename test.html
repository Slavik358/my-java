<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тестер Лабораторной 22 (MS SQL)</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f4f9; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #333; border-bottom: 2px solid #007bff; padding-bottom: 5px; margin-top: 30px; }
        .btn { padding: 10px 15px; margin: 5px; border: none; border-radius: 4px; cursor: pointer; color: white; font-weight: bold; transition: opacity 0.2s; width: 100%; text-align: left; }
        .btn:hover { opacity: 0.8; }
        .btn-get { background: #28a745; }
        .btn-post { background: #007bff; }
        .btn-error { background: #dc3545; }
        #output { background: #1e1e1e; color: #00ff00; padding: 15px; border-radius: 5px; margin-top: 20px; white-space: pre-wrap; font-family: monospace; border: 1px solid #333; min-height: 60px; }
        .hint { font-size: 0.9em; color: #666; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛠️ Тестер API (Лабораторная 22: MS SQL)</h1>
        <p>Убедись, что MS SQL Server запущен и Java-сервер работает. Нажимай на кнопки для скриншотов.</p>

        <h2>Задание 1: Подключение и Пул</h2>
        <button class="btn btn-get" onclick="makeRequest('GET', '/task1/single')">Одиночное соединение <span class="hint">(Скриншот: версия, БД, пользователь)</span></button>
        <button class="btn btn-get" onclick="makeRequest('GET', '/task1/pool')">Пул соединений <span class="hint">(Скриншот: размер пула, версия)</span></button>
        <button class="btn btn-error" onclick="makeRequest('GET', '/task1/error')">Ошибка подключения <span class="hint">(Скриншот: неверный пароль)</span></button>

        <h2>Задание 2: CRUD и Параметризация</h2>
        <button class="btn btn-post" onclick="makeRequest('GET', '/task2/create')">Создать таблицу <span class="hint">(Скриншот: таблица students создана)</span></button>
        <button class="btn btn-post" onclick="makeRequest('GET', '/task2/insert')">INSERT студента <span class="hint">(Скриншот: id, affectedRows)</span></button>
        <button class="btn btn-get" onclick="makeRequest('GET', '/task2/select')">SELECT студентов <span class="hint">(Скриншот: список с сортировкой)</span></button>
        <button class="btn btn-post" onclick="makeRequest('GET', '/task2/update')">UPDATE оценки <span class="hint">(Скриншот: affectedRows)</span></button>
        <button class="btn btn-error" onclick="makeRequest('GET', '/task2/delete')">DELETE студента <span class="hint">(Скриншот: affectedRows)</span></button>
        <button class="btn btn-error" onclick="makeRequest('GET', '/task2/injection')">Проверка SQL-инъекции <span class="hint">(Скриншот: safe_count vs unsafe_count)</span></button>

        <h2>Задание 3: Ошибки, Стриминг, Транзакции</h2>
        <button class="btn btn-error" onclick="makeRequest('GET', '/task3/errors')">Демонстрация ошибок <span class="hint">(Скриншот: ECONNREFUSED, SYNTAX, DUP_ENTRY)</span></button>
        <button class="btn btn-get" onclick="makeRequest('GET', '/task3/stream')">Потоковый запрос (Stream) <span class="hint">(Скриншот: чтение через ResultSet)</span></button>
        <button class="btn btn-post" onclick="makeRequest('GET', '/task3/transaction/commit')">Транзакция (Commit) <span class="hint">(Скриншот: успешный commit)</span></button>
        <button class="btn btn-error" onclick="makeRequest('GET', '/task3/transaction/rollback')">Транзакция (Rollback) <span class="hint">(Скриншот: откат из-за ошибки)</span></button>

        <h2>📟 Результат:</h2>
        <div id="output">Здесь появятся результаты запросов...</div>
    </div>

        <script>
        async function makeRequest(method, path) {
            const output = document.getElementById('output');
            output.textContent = `⏳ Отправка ${method} ${path}...\n`;
            try {
                const response = await fetch('http://localhost:3000' + path, { method });
                
                // БЕЗОПАСНОЕ чтение тела ответа (проверяем заголовок, чтобы не читать дважды)
                const contentType = response.headers.get("content-type");
                let data;
                if (contentType && contentType.includes("application/json")) {
                    data = await response.json();
                } else {
                    data = await response.text();
                }

                let color = response.ok ? '#00ff00' : '#ff4444';
                
                // Красивый вывод: если это объект, делаем JSON, если текст - выводим как есть
                const formattedData = typeof data === 'object' ? JSON.stringify(data, null, 2) : data;
                
                output.innerHTML = `<span style="color:${color}">Статус: ${response.status} ${response.statusText}</span>\n\nОтвет сервера:\n${formattedData}`;
            } catch (error) {
                output.innerHTML = `<span style="color:#ff4444">Ошибка сети:\n${error.message}\n(Убедись, что Java-сервер запущен и MS SQL работает!)</span>`;
            }
        }
    </script>
</body>
</html>
